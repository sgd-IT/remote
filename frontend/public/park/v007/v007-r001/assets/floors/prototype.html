<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 T1 两层建模原型检查</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#d9e7ed;font:14px system-ui}canvas{display:block}aside{position:absolute;left:18px;top:18px;width:235px;padding:20px;background:#f8fcffe8;border:1px solid #fff;border-radius:8px;box-shadow:0 8px 40px #22334422}h1{font-size:19px;margin:0 0 15px}button{border:1px solid #bdd0db;background:white;border-radius:5px;padding:8px;margin:3px;cursor:pointer}p{line-height:1.7;color:#486272}#stats{white-space:pre-wrap;font-size:12px}</style><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><aside><h1>T1 两层模型原型</h1><button id="f1">F1 大堂</button><button id="f2">F2 办公</button><button id="both">两层组合</button><button id="near">核心近景</button><button id="desk">工位近景</button><button id="shell">切换薄壳</button><button id="spin">绕转</button><p>实载优化 GLB · 固定源轮廓<br>拖动旋转，滚轮缩放</p><div id="stats">载入中</div></aside><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#dce8ec');const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.08,500);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minPolarAngle=.08;controls.maxPolarAngle=1.48;controls.target.set(0,2,0);camera.position.set(64,64,77);controls.update();
scene.add(new THREE.HemisphereLight(0xc9e6ff,0x7b756a,2.2));const sun=new THREE.DirectionalLight(0xfff6e9,3.1);sun.position.set(20,45,25);scene.add(sun);const fill=new THREE.DirectionalLight(0xd8efff,1.3);fill.position.set(-30,20,-30);scene.add(fill);const loader=new GLTFLoader();let models=[],spinning=false;
for(let n of[1,2]){const g=await loader.loadAsync(`./t1_f0${n}-lod0.glb`);g.scene.traverse(o=>{if(o.isMesh){o.material.side=THREE.DoubleSide;o.material.forceSinglePass=true;if(o.name.includes('GLASS_')){o.material.transparent=true;o.material.opacity=.15;o.material.depthWrite=false;o.renderOrder=2;}}});models.push(g.scene);scene.add(g.scene);g.scene.position.y=n===2?6:0;}
function show(mode){models.forEach((o,i)=>{o.visible=mode==='both'||mode===i+1;o.position.y=mode==='both'&&i===1?6:0});camera.position.set(64,64,77);controls.target.set(0,mode==='both'?4:1.8,0);controls.update();}
document.querySelector('#f1').onclick=()=>show(1);document.querySelector('#f2').onclick=()=>show(2);document.querySelector('#both').onclick=()=>show('both');document.querySelector('#near').onclick=()=>{show(1);camera.position.set(13,12,15);controls.target.set(-3,1.8,1);controls.update()};document.querySelector('#desk').onclick=()=>{show(2);camera.position.set(-1,7,-5);controls.target.set(-5,1,-11);controls.update()};document.querySelector('#shell').onclick=()=>models.forEach(m=>m.traverse(o=>{if(o.name.includes('GLASS_'))o.visible=!o.visible}));document.querySelector('#spin').onclick=()=>spinning=!spinning;
show(1);window.__floorPrototype={models,scene,camera,renderer,controls,show,ready:true};
function animate(){requestAnimationFrame(animate);if(spinning){const delta=camera.position.clone().sub(controls.target);delta.applyAxisAngle(new THREE.Vector3(0,1,0),.004);camera.position.copy(controls.target).add(delta)}controls.update();renderer.render(scene,camera);document.querySelector('#stats').textContent=`GLB：${models.filter(m=>m.visible).length} 个\n整帧 calls：${renderer.info.render.calls}\n三角面：${renderer.info.render.triangles}\n分辨率：${renderer.domElement.width} × ${renderer.domElement.height}`;}animate();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
